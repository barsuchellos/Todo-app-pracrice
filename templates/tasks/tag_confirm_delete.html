{% extends 'tasks/base.html' %}

{% block content %}

  <h2 class="mb-4">Delete Tag "{{ tag.name }}"?</h2>

  <form method="POST">
    {% csrf_token %}
    <button type="submit" class="btn btn-danger">Delete</button>
    <a href="{% url 'tasks:tags-list' %}" class="btn btn-outline-secondary">Cancel</a>
  </form>

{% endblock content %}
