{% extends 'tasks/base.html' %}

{% block content %}

  <div class="d-flex justify-content-between align-items-center mb-4">
    <h1>Tags</h1>
    <a href="{% url 'tasks:tags-create' %}" class="btn btn-primary">Add Tag</a>
  </div>

  <table class="table table-bordered">
    <thead class="table-dark">
    <tr>
      <th>Name</th>
      <th>Actions</th>
    </tr>
    </thead>
    <tbody>
    {% for tag in tags %}
      <tr>
        <td>{{ tag.name }}</td>
        <td class="d-flex gap-2">
          <a href="{% url 'tasks:tags-update' tag.pk %}" class="btn btn-sm btn-outline-primary">Update</a>
          <a href="{% url 'tasks:tags-delete' tag.pk %}" class="btn btn-sm btn-outline-danger">Delete</a>
        </td>
      </tr>
    {% endfor %}
    </tbody>
  </table>

{% endblock content %}
